get:
  tags: [Signup]
  summary: Tenant Verification
  operationId: verifyTenant
  parameters:
    - name: activationKey
      in: query
      description: 'The registration activation key'
      required: true
      schema:
        type: string
  responses:
    200:
      description: successful operation
      content:
        application/json:
          schema:
            $ref: '../../common/components/user/schema.yaml#/SignupResponse'
    '400':
      $ref: '../../common/components/responses.yaml#/BadRequest'
    '404':
      $ref: '../../common/components/responses.yaml#/NotFound'

  security:
    - oauth2: []